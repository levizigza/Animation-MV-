<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animation MV — Oino (Interlude)</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --fg: #e8e4dc;
        --muted: #a8a098;
        --line: #2a2824;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1a1814 0%, var(--bg) 55%);
        color: var(--fg);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        width: min(40rem, 100%);
        text-align: center;
      }
      h1 {
        font-weight: 400;
        letter-spacing: 0.06em;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        margin: 0 0 0.75rem;
      }
      .date {
        color: var(--muted);
        font-size: 1rem;
        margin: 0 0 2rem;
      }
      p {
        color: var(--muted);
        line-height: 1.55;
        margin: 0 0 1.5rem;
      }
      a {
        color: var(--fg);
        text-underline-offset: 0.2em;
      }
      .card {
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 1.5rem 0;
        margin-bottom: 1.5rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>One Of Gods Fools</h1>
      <p class="date">December 10, 2026</p>
      <div class="card">
        <p>
          Craft-first music film pipeline for <strong>Oino (Interlude)</strong> —
          Blender / X-sheet cel production, not diffusion-primary.
        </p>
      </div>
      <div class="links">
        <a href="https://github.com/levizigza/Animation-MV-">GitHub repository</a>
        <a href="https://github.com/levizigza/Animation-MV-/tree/main/projects/oino-interlude">Oino project</a>
        <a href="https://github.com/levizigza/Animation-MV-/blob/main/projects/oino-interlude/CANON.md">Canon</a>
      </div>
    </main>
  </body>
</html>
