[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvm"
version = "0.1.0"
description = "Cel Music Video Studio — Blender-primary, craft-first animated music video pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "librosa>=0.10",
  "soundfile>=0.12",
  "scipy>=1.11",
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "python-slugify>=8.0",
  "imageio-ffmpeg>=0.5",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
studio = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
mvm = "mvm.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mvm*"]

[tool.ruff]
line-length = 100